# Catch-all for any Host this box does not serve.
#
# This block used to proxy EVERYTHING — including /admin — to the app behind a
# self-signed certificate, so any Host header reached the panel. It answers
# requests that match no other server_name; there is no legitimate client here,
# only scanners and anyone probing the origin by IP.
#
# 444 closes the connection without a response, which is cheaper than an error
# page and tells a scanner nothing.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;
    return 444;
}
