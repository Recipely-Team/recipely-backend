# api.recipely.net — the API. NOT proxied by Cloudflare (the 100 s origin
# timeout cannot hold a ~2 minute Instagram import).
server {
    server_name api.recipely.net;

    # The admin panel lives on admin.recipely.net, which is proxied by
    # Cloudflare and sits behind Access. This hostname is DNS-only — it has to
    # be, for the ~2 minute import that Cloudflare's fixed 100 s origin timeout
    # would cut off — so anything answered here has no Access in front of it.
    # Leaving /admin reachable would keep the unprotected door open under a
    # second name.
    location /admin {
        return 404;
    }

    # WHY: nginx defaults to 1 MB and applies it to the WHOLE request, so every
    # upload the product allows was being refused before it reached the app —
    # a 5 MB avatar, a 10 MB recipe photo, a 50 MB video — with nginx's own HTML
    # 413, which the app cannot localize or even recognise. A user replacing
    # their profile photo got an error for a file the API would have accepted.
    #
    # 55m sits just above the largest single file Multer takes (50 MB, video on
    # /recipes/with-media), so the gate that refuses an upload is the one that
    # answers in the user's language and names the field. The proxy must never
    # be the narrower of the two: whatever it rejects, the app cannot explain.
    client_max_body_size 55m;

    location / {
        proxy_pass http://localhost:3000;
        # Instagram import runs a full download+transcribe+vision pipeline;
        # measured 59-128 s on the 1 OCPU box. Must outlast the app's own
        # 180 s abort so the client gets its clean 503 instead of a raw 504.
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # WHY: without these the app saw only nginx's socket address, so every
        # caller shared one rate-limit key — a per-caller limit acting as a
        # global one, where the first script to hit the cap locks everyone out.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pin X-Forwarded-Host to the nginx-resolved host, overwriting any client
        # value. The app's admin host-gate reads req.hostname (= X-Forwarded-Host
        # under trust proxy); this hostname is DNS-only, so without the override a
        # caller could send `X-Forwarded-Host: admin.recipely.net` and be served
        # the whole panel here, outside Access + mTLS. $host can never be the
        # admin name on this vhost — that Host routes to the admin server block.
        proxy_set_header X-Forwarded-Host  $host;

        # Cloudflare does not proxy this hostname, so nothing overwrites these
        # and a caller can send any value. The rate-limit key derives from
        # CF-Connecting-IP, so a forged one would let one caller take a fresh
        # key on every request and never reach a limit.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-Ray           "";
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.recipely.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.recipely.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = api.recipely.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name api.recipely.net;
    return 404; # managed by Certbot
}
