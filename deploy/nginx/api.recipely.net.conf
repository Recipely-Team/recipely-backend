# api.recipely.net — the API. NOT proxied by Cloudflare.
#
# Direct because Cloudflare's origin timeout is 100 s and cannot be raised on
# Free/Pro/Business, while the Instagram import measures ~119 s. Proxying this
# hostname makes long imports fail with 524.
#
# Because it is direct, nothing upstream sanitises request headers. The two
# `proxy_set_header` lines below are what stand in for that.

server {
    listen 80;
    listen [::]:80;
    server_name api.recipely.net;

    # Let's Encrypt HTTP-01. Must stay reachable on port 80 or renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.recipely.net;

    ssl_certificate     /etc/letsencrypt/live/api.recipely.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.recipely.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # NO ssl_verify_client here. Authenticated Origin Pulls belongs on the
    # proxied hostnames; requiring a Cloudflare client certificate on this one
    # would reject every real user, who connects directly.

    # The admin panel does not live on this hostname. Access protects it at the
    # Cloudflare edge, which only applies to admin.recipely.net — leaving /admin
    # answerable here would keep the unprotected door open under a new name.
    location /admin {
        return 404;
    }

    # The recipe import runs ~2 minutes server-side. The default 60 s proxy read
    # timeout would cut it off well before the app gives up.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    # Recipe images and avatars.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pin X-Forwarded-Host to the nginx-resolved host, overwriting any client
        # value. The app's admin host-gate reads req.hostname (= X-Forwarded-Host
        # under trust proxy); this hostname is DNS-only, so without the override a
        # caller could send `X-Forwarded-Host: admin.recipely.net` and be served
        # the whole panel here, outside Access + mTLS. $host can never be the
        # admin name on this vhost — that Host routes to the admin server block.
        proxy_set_header X-Forwarded-Host  $host;

        # Clear anything the caller sent under Cloudflare's name. Nothing
        # overwrites these on a hostname Cloudflare does not proxy, and the app
        # derives its rate-limit key from CF-Connecting-IP — a forged value
        # would let one caller take a fresh key on every request and never
        # reach a limit. The app also ignores it at PROXY_DEPTH=1; this is the
        # second lock, here because it does not depend on app config being right.
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header CF-Ray           "";
    }
}
