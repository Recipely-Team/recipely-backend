server {
    server_name dev-api.recipely.net;

    # Recipe media uploads: multer accepts up to 50 MB per file, but nginx
    # defaults to 1 MB, so a 2.2 MB photo was rejected with 413 before ever
    # reaching the app — the browser reported it as a timeout.
    client_max_body_size 55m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        # Instagram import runs a full download+transcribe+vision pipeline;
        # measured 59-128 s on the 1 OCPU box. Must outlast the app's own
        # 180 s abort so the client gets its clean 503 instead of a raw 504.
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The AdminJS panel and its assets, routed the way the production box routes them.
    location /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/dev-api.recipely.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/dev-api.recipely.net/privkey.pem; # managed by Certbot
    ssl_client_certificate /etc/nginx/ssl/aop/ca.crt;
    ssl_verify_client on;
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = dev-api.recipely.net) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name dev-api.recipely.net;
    return 404; # managed by Certbot


}