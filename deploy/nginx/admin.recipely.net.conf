# admin.recipely.net — the AdminJS panel only. Proxied by Cloudflare + Access.
#
# The panel has its own hostname because Cloudflare's proxy is a per-hostname
# setting: there is no way to put Access in front of one path of a hostname and
# leave the rest direct. api.recipely.net has to stay direct for the 100 s
# import ceiling, so the panel moves rather than the API.
#
# Two locks in series, and they protect different things:
#   Access  — decides WHO reaches the box at all (identity, at the edge)
#   AdminJS — decides who may sign in to the panel (its own password)
# Neither replaces the other. Access is not a password; AdminJS cannot keep an
# anonymous request from reaching the box.

server {
    listen 80;
    listen [::]:80;
    server_name admin.recipely.net;

    # Renewal must stay reachable before the redirect and before Access, or the
    # certificate expires and the panel becomes unreachable rather than merely
    # protected.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.recipely.net;

    ssl_certificate     /etc/letsencrypt/live/admin.recipely.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.recipely.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Authenticated Origin Pulls: only Cloudflare may open this connection.
    # Without it, anyone who learns the origin IP sends `Host: admin.recipely.net`
    # and arrives with Access never consulted — which is exactly how the panel
    # was reachable before this split.
    #
    # Enable AFTER the certificate exists and the site loads. Reverting is one
    # `off` and a reload, which is why this comes before the firewall work.
    ssl_client_certificate /etc/ssl/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    # Nothing here is cacheable and some of it is session-bound.
    add_header Cache-Control "no-store" always;

    # Only the panel. A stray API call arriving on this hostname would be
    # answered by an app that does not expect Access in front of it.
    location = / {
        return 302 /admin;
    }

    location /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        # REPLACE the chain rather than append to it, and this is the subtle
        # part of the whole split.
        #
        # `PROXY_DEPTH` is one value for one process, but the two hostnames have
        # different chain lengths: client→nginx→app here would be depth 1, while
        # client→Cloudflare→nginx→app is depth 2. The app cannot be both, and
        # depth must stay 1 because api.recipely.net is direct — setting it to 2
        # there would make Express believe an X-Forwarded-For entry the caller
        # wrote.
        #
        # So this block makes the admin chain LOOK like the direct one: forward
        # only the address Cloudflare reported, so the depth-1 arithmetic lands
        # on the real client either way. `$proxy_add_x_forwarded_for` would
        # append the Cloudflare edge and shift the answer by one hop.
        #
        # Safe because ssl_verify_client above means only Cloudflare opens this
        # connection, so $http_cf_connecting_ip cannot have been written by a
        # caller.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;

        # Not forwarded: the app ignores it at PROXY_DEPTH=1 anyway, and leaving
        # it out keeps one path to the client address instead of two.
        proxy_set_header CF-Connecting-IP "";
    }

    location / {
        return 404;
    }
}
