# admin.recipely.net — the AdminJS panel only. Proxied by Cloudflare + Access.
#
# The panel has its own hostname because Cloudflare's proxy is a per-hostname
# setting: Access cannot be put in front of one path and not another, and
# api.recipely.net must stay direct for the ~2 minute Instagram import that
# Cloudflare's fixed 100 s origin timeout would cut off.
#
# Two locks in series, protecting different things:
#   Access  — decides WHO reaches this box at all (identity, at the edge)
#   AdminJS — decides who may sign in to the panel (its own password)
# Neither replaces the other.
#
# The certificate is a Cloudflare Origin CA cert: trusted only by Cloudflare,
# which is the point — nothing else should be connecting. It also removes the
# renewal failure mode entirely. Let's Encrypt could not be used here at all:
# Access intercepts the HTTP-01 challenge, so every renewal would fail and the
# panel would go dark 90 days later.

server {
    listen 80;
    listen [::]:80;
    server_name admin.recipely.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.recipely.net;

    ssl_certificate     /etc/nginx/ssl/admin.recipely.net/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/admin.recipely.net/origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Authenticated Origin Pulls: only a connection presenting Cloudflare's
    # client certificate is accepted. Without it, anyone who learns the origin
    # IP sends `Host: admin.recipely.net` and arrives with Access never
    # consulted — which is exactly how the panel was reachable before the split.
    #
    # Reverting is one `off` and a reload, which is why this lands before the
    # old /admin path is closed.
    ssl_client_certificate /etc/ssl/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;

    # Nothing here is cacheable and some of it is session-bound.
    add_header Cache-Control "no-store" always;

    location = / {
        return 302 /admin;
    }

    location /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;

        # REPLACE the chain rather than append to it.
        #
        # PROXY_DEPTH is one value for one process, but the two hostnames have
        # different chain lengths: direct is one hop, via Cloudflare is two.
        # Depth must stay 1 because api.recipely.net is direct — raising it
        # would make Express believe an X-Forwarded-For entry the caller wrote.
        # Forwarding only the address Cloudflare reported makes the depth-1
        # arithmetic land on the real client on both hostnames.
        # $proxy_add_x_forwarded_for would append the edge and shift it by one.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;

        # Not forwarded: the app ignores it at PROXY_DEPTH=1, and leaving it out
        # keeps a single path to the client address rather than two.
        proxy_set_header CF-Connecting-IP "";
    }

    # A stray API call arriving here would be answered by an app that does not
    # expect Access in front of it.
    location / {
        return 404;
    }
}
