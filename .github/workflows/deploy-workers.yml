name: Deploy import workers

# One repository, one image, every worker box.
#
# A worker runs `dist/worker/main.js` from the SAME image the API runs — it
# needs yt-dlp, ffmpeg and python, which that image already carries. So this
# workflow builds once and fans the identical image out to every host in the
# host list. Adding a third worker is adding an entry to `WORKER_HOSTS`.
#
# Runs on a push to dev, but ONLY when something a worker actually runs has
# changed. The path filter is the whole point: a worker deploy restarts a box
# that may be mid-import, so paying that cost for an API-only change buys
# nothing.
#
# The corollary is deliberate: a change under @core or @domain does NOT deploy
# the workers, so a worker can be running an older image than the API. That is
# a SUPPORTED state, not a gap — claim/complete/fail is a stable three-call
# contract, not a shared binary. Widening these paths to "everything the worker
# transitively imports" would mean deploying on nearly every push, which is the
# behaviour this filter exists to avoid. When a change genuinely needs the two
# in step, run this workflow by hand.

on:
  push:
    branches: [dev]
    paths:
      - 'src/worker/**'
      # The importer the worker runs, and the DTOs it reports back with.
      - 'src/infrastructure/ai/**'
      - 'src/application/ai/**'
      # The image itself: base packages, yt-dlp pin, ffmpeg.
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      # How the box runs it, and this file.
      - 'deploy/worker/**'
      - '.github/workflows/deploy-workers.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to deploy
        required: false
        default: dev

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npx jest tests/unit/worker tests/unit/application/imports tests/unit/domain/imports

  # Build and deploy are ONE job because the thing they would have to pass
  # between them is a 276 MB image tarball, and the only way to pass a file
  # between jobs is an artifact. That upload is charged against the account's
  # Actions storage, which a 500 MB quota full of release IPAs had already
  # exhausted — so every push here failed on `Artifact storage quota has been
  # hit` while nothing in the deploy was wrong. Kept on one runner the tarball
  # is a local file, and the deploy that used to need a quota needs none.
  #
  # `deploy-dev.yml` has always shipped its image this way. Nothing here needed
  # a matrix: the host loop is inside the job, one box at a time.
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: recipely-backend:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Built once and copied, rather than rebuilt per host: identical bytes on
      # every worker is the property that makes "which version is box 2 on?" a
      # question with one answer.
      - name: Save image as compressed tar
        run: docker save recipely-backend:latest | gzip -1 > recipely-worker-image.tar.gz

      # Read the host list INSIDE the job, never in `strategy.matrix`.
      # Matrix expressions are evaluated before the job's environment is
      # applied, so an environment-scoped `WORKER_HOSTS` is invisible there —
      # and the failure mode is not an error naming the variable, it is a
      # `deploy` job that never appears at all, under a run whose other jobs
      # are green. That cost an afternoon; it must not cost another one.
      - name: Resolve worker hosts
        id: hosts
        env:
          WORKER_HOSTS: ${{ vars.WORKER_HOSTS }}
        run: |
          if [ -z "${WORKER_HOSTS:-}" ]; then
            echo "::error::WORKER_HOSTS is not set. Add a repository *variable* (Settings -> Secrets and variables -> Actions -> Variables) named WORKER_HOSTS, e.g. [\"79.76.100.116\",\"92.5.5.241\"] or a plain space-separated list."
            exit 1
          fi
          # Accept a JSON array or a plain space/comma-separated list, because
          # the difference is not something anyone should have to remember.
          hosts=$(printf '%s' "$WORKER_HOSTS" | tr -d '[]"' | tr ',' ' ')
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo "Deploying to:$hosts"

      - name: Deploy to every worker
        env:
          HOSTS: ${{ steps.hosts.outputs.hosts }}
          SSH_USER: ${{ secrets.WORKER_SSH_USER }}
          SSH_KEY: ${{ secrets.WORKER_SSH_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${SSH_USER:-}" ] || [ -z "${SSH_KEY:-}" ]; then
            echo "::error::WORKER_SSH_USER and WORKER_SSH_KEY secrets are required."
            exit 1
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/worker_key
          chmod 600 ~/.ssh/worker_key
          SSH_OPTS="-i $HOME/.ssh/worker_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=30"

          # The remote half lives in a file rather than a heredoc inside an
          # `if`, where bash's parsing of the two together is easy to get
          # subtly wrong and hard to notice.
          cat > /tmp/remote-deploy.sh <<'REMOTE'
          set -euo pipefail
          mkdir -p ~/recipely-worker
          cp /tmp/docker-compose.yml ~/recipely-worker/docker-compose.yml
          # .env is written once, by hand, and never by CI: it holds the shared
          # secret and the Groq key, and a workflow that could write it would be
          # a workflow that could read it back out.
          test -f ~/recipely-worker/.env || { echo "missing ~/recipely-worker/.env"; exit 1; }
          sudo docker load -i /tmp/recipely-worker-image.tar.gz
          rm -f /tmp/recipely-worker-image.tar.gz
          cd ~/recipely-worker
          # SIGTERM lets a job in flight finish and report, so a routine
          # redeploy does not cost a user their import.
          sudo docker compose up -d --no-build --remove-orphans
          sudo docker image prune -f
          sleep 10
          sudo docker compose ps
          # A healthy idle worker logs `import_worker_started` and then nothing
          # at all — silence here is the correct outcome.
          sudo docker compose logs --tail=30 worker
          REMOTE

          failed=""
          for host in $HOSTS; do
            echo "::group::$host"
            # One box at a time: taking the whole fleet down at once would stop
            # the queue draining for the length of a `docker load`.
            if scp $SSH_OPTS recipely-worker-image.tar.gz deploy/worker/docker-compose.yml "$SSH_USER@$host:/tmp/" \
               && ssh $SSH_OPTS "$SSH_USER@$host" bash -s < /tmp/remote-deploy.sh; then
              echo "$host OK"
            else
              # A failure on one box must not stop the others being updated: a
              # half-updated fleet still works, an undeployed one does not.
              echo "::warning::$host: deploy failed"
              failed="$failed $host"
            fi
            echo "::endgroup::"
          done

          rm -f ~/.ssh/worker_key /tmp/remote-deploy.sh
          if [ -n "$failed" ]; then
            echo "::error::failed on:$failed"
            exit 1
          fi
